# Software for the lessons' command-line parts and tests. Versions as tested on 2026-11-04.
# The environment keeps its original name, gene-catalogs, which the Codespace and CI use.
name: gene-catalogs
channels:
  - conda-forge
  - bioconda
dependencies:
  - prodigal=2.6.3
  - mmseqs2=18.8cc5c   # the release mCATs is tested with (see mmseqs_clustering.rst)
  - bwa=0.7.19
  - samtools=1.25
  - seqtk=1.5
  - r-base=4.5
  - r-dplyr=1.2
  - r-tidyr=1.3
  - r-readr=2.2
  - r-ggplot2=4.0
  # metatranscriptomics lesson: the same packages the pages load in the browser
  - bioconductor-deseq2=1.50
  - bioconductor-fgsea=1.36
  # only needed to rebuild the lesson data (data-prep/)
  - spades=4.3
  - biopython=1.88
  - bioconductor-keggrest=1.50
