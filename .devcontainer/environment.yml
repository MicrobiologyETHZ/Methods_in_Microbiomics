# Software for the gene-catalog workshop (Parts A–C). Versions as tested on 2026-11-04.
name: gene-catalogs
channels:
  - conda-forge
  - bioconda
dependencies:
  - prodigal=2.6.3
  - mmseqs2=18.8cc5c   # the release mCATs is tested with (see mmseqs_clustering.rst)
  - bwa=0.7.19
  - samtools=1.25
  - seqtk=1.5
  - r-base=4.5
  - r-dplyr=1.2
  - r-tidyr=1.3
  - r-readr=2.2
  - r-ggplot2=4.0
  # only needed to rebuild the lesson data (data-prep/)
  - spades=4.3
  - biopython=1.88
