# Build, test and publish the new site (branch `next`).
#
# 1. If the committed lesson data are provisional (built with MMSEQS_DEV_ARGS on a small
#    machine), rebuild them with the exact settings and commit them back to the branch.
# 2. Run every lesson page's terminal commands and R cells, as a learner would.
# 3. Render the Quarto site, check links, and deploy it to GitHub Pages.
# 4. Build the Codespace (devcontainer) and run the workshop inside it.
name: Site (next)

on:
  push:
    branches: [next]
  pull_request:
    branches: [next]
  workflow_dispatch:
    inputs:
      rebuild-data:
        description: "Rebuild the lesson data even if they are not provisional"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: site-next-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash -el {0}   # login shell, so the micromamba environment is active

jobs:
  build:
    runs-on: ubuntu-latest   # 4 CPUs / 16 GB: enough for the exact MMseqs2 settings
    steps:
      - uses: actions/checkout@v4

      - uses: mamba-org/setup-micromamba@v2
        with:
          environment-file: .devcontainer/environment.yml
          cache-environment: true

      - name: Rebuild lesson data if provisional
        id: data
        run: |
          if grep -q '"provisional": true' site/lessons/gene-catalogs/data/provenance.json \
             || [ "${{ inputs.rebuild-data }}" = "true" ]; then
            bash data-prep/gene-catalogs/prepare.sh 4
            echo "rebuilt=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Keep rebuilt data as an artifact
        if: steps.data.outputs.rebuilt == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rebuilt-lesson-data
          path: |
            site/lessons/gene-catalogs/data
            workshop/gene-catalogs/reference.tsv
            workshop/gene-catalogs/provenance.json
            workshop/gene-catalogs/data/scaffolds

      # GitHub sometimes rejects pushes to this repo with "Internal Server Error", so retry,
      # and don't fail the build: the tests and the site below use the rebuilt data either way.
      - name: Commit rebuilt data
        if: steps.data.outputs.rebuilt == 'true' && github.event_name != 'pull_request'
        continue-on-error: true
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/lessons/gene-catalogs/data workshop/gene-catalogs
          git commit -m "Rebuild gene-catalog lesson data with exact MMseqs2 settings" || { echo "No changes"; exit 0; }
          for attempt in 1 2 3 4; do
            git push && exit 0
            echo "Push failed (attempt $attempt), retrying in $((attempt * 20)) s"
            sleep $((attempt * 20))
            git pull --rebase
          done
          echo "::warning::Could not push the rebuilt data. Download the 'rebuilt-lesson-data' artifact, or rebuild in a Codespace."
          exit 1

      # The reads aren't in git; the Codespace unpacks them on creation, CI does it here.
      - name: Unpack workshop reads
        run: bash workshop/gene-catalogs/setup.sh

      - name: Test page commands (Parts A–C)
        run: python tests/page_commands.py workshop/gene-catalogs site/lessons/gene-catalogs/0[1-3]*.qmd

      - name: Test live R cells and exercise checks
        run: python tests/webr_cells.py site/lessons/gene-catalogs/0[1-4]*.qmd site/lessons/metatranscriptomics/0[2-5]*.qmd

      - uses: quarto-dev/quarto-actions/setup@v2

      - name: Render site
        run: quarto render site

      # Packages the lessons need that no public repository builds for our webR version,
      # built here and published with the site, at /wasm/. Pages that need them list that
      # URL under `webr: repos`, before repo.r-wasm.org, so these builds are used first.
      # - locfit (for DESeq2, metatranscriptomics Part 3): no webR build anywhere.
      # - fastmatch (for fgsea, Part 4): its src/dummy.c, there only to satisfy CRAN checks,
      #   declares `void R_registerRoutines(void)`. WebAssembly checks function signatures
      #   at load time, so every webR build (repo.r-wasm.org's too) fails with
      #   "R_registerRoutines": imported function does not match the expected type.
      #   Build it from the CRAN source with dummy.c (and the MD5 list) removed.
      # Keep the webR version in step with the extension (site/_extensions/r-wasm/live/live.lua).
      # rwasm is called directly, not through r-wasm/actions/build-rwasm, because two of its
      # defaults need working around:
      # - `remotes = NULL`: resolving rwasm's built-in list of webR-patched packages currently
      #   fails ("`nrow(out)` must equal `1`"), and locfit needs none of them.
      # - locfit asks for C17 (SystemRequirements: USE_C17), but rwasm's webr-vars.mk only
      #   points CC at emcc, so C17 code went to the host gcc. rwasm includes
      #   ~/.webr-vars.mk, so set the C17 compiler there, with the usual wasm C flags. (Not
      #   `C17FLAGS = $(CFLAGS)`: R passes CFLAGS=$(C17FLAGS) to make, which would recurse.)
      - name: Build webR packages missing from public repositories
        run: |
          docker run --rm -v "$PWD:/work" -w /work -e GITHUB_PAT="${{ github.token }}" \
            --entrypoint bash ghcr.io/r-wasm/webr:v0.6.0 -c '
              set -e
              printf "\nCC17 = emcc\nC17FLAGS = \$(WASM_CFLAGS) -std=gnu17\n" >> ~/.webr-vars.mk
              Rscript -e "download.packages(\"fastmatch\", \"/tmp\", repos = \"https://cloud.r-project.org\")"
              tar xzf /tmp/fastmatch_*.tar.gz -C /tmp
              rm /tmp/fastmatch/src/dummy.c /tmp/fastmatch/MD5
              Rscript -e "pak::pak(\"r-wasm/rwasm\")" \
                      -e "rwasm::add_pkg(c(\"locfit\", \"local::/tmp/fastmatch\"), repo_dir = \"site/_site/wasm\", remotes = NULL)"
            '
          # rwasm only warns when a build fails, so check that every package made it into the repo
          for pkg in locfit fastmatch; do
            grep -q "^Package: $pkg$" site/_site/wasm/bin/emscripten/contrib/*/PACKAGES \
              || { echo "::error::$pkg was not built for webR"; exit 1; }
          done

      - name: Check links
        uses: lycheeverse/lychee-action@v2
        with:
          args: --no-progress --accept 200,403,429 'site/_site/**/*.html'
          fail: true

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: site/_site

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  codespace:
    needs: build   # uses the (possibly rebuilt) data committed by the build job
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.sha || github.ref }}
      - name: Build the devcontainer and run the workshop in it
        uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: |
            micromamba run -n gene-catalogs bash -c 'cd workshop/gene-catalogs && bash solutions/run_lesson.sh 4 && ./check a b c'
