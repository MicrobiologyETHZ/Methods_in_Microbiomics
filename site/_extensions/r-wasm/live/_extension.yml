title: Quarto Live
author: George Stagg
version: 0.1.3-dev
# Local patch in resources/live-runtime.js (renderHints, render): "Show Solution" is
# shown next to "Show Hint" from the start, not only after all hints are opened.
# Reapply after updating the extension.
quarto-required: ">=1.4.0"
contributes:
  filters:
    - live.lua
  formats:
    common:
      ojs-engine: true
      filters:
        - live.lua
    html: default
    revealjs: default
    dashboard: default
